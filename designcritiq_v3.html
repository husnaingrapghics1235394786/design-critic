<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesignCritiq — AI Design Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050508;--bg2:#0c0c14;--bg3:#12121e;--bg4:#1a1a2e;
  --border:#ffffff12;--border2:#ffffff20;--border3:#ffffff35;
  --text:#f0f0ff;--text2:#a0a0c0;--text3:#606080;
  --accent:#7c6fff;--accent2:#b06fff;--accent3:#ff6fd8;
  --green:#4fffb0;--red:#ff4f6d;--yellow:#ffd166;--blue:#4fb3ff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
a{color:var(--accent)}

.grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.2'/%3E%3C/svg%3E")}
.orb{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
.orb1{width:700px;height:700px;background:radial-gradient(circle,#7c6fff18,transparent 70%);top:-250px;left:-250px}
.orb2{width:600px;height:600px;background:radial-gradient(circle,#ff6fd80e,transparent 70%);bottom:-150px;right:-150px}
.orb3{width:450px;height:450px;background:radial-gradient(circle,#4fb3ff0b,transparent 70%);top:45%;left:35%}

.wrap{position:relative;z-index:1;min-height:100vh;padding:0 20px}

/* ── NAV ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;max-width:1140px;margin:0 auto;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.5px;text-decoration:none;color:var(--text)}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c6fff,#ff6fd8);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-badge{font-size:11px;background:#ffffff0d;border:1px solid var(--border2);padding:5px 12px;border-radius:20px;color:var(--text2)}
.nav-btn{font-size:12px;background:#7c6fff15;border:1px solid #7c6fff40;color:#a99fff;padding:7px 15px;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.nav-btn:hover{background:#7c6fff28}
.nav-btn.danger{background:#ff4f6d12;border-color:#ff4f6d35;color:#ff8fa0}
.nav-btn.danger:hover{background:#ff4f6d22}

/* ── HERO ── */
.hero{max-width:820px;margin:65px auto 0;text-align:center;padding:0 16px}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:#7c6fff10;border:1px solid #7c6fff30;color:#a99fff;font-size:12px;font-weight:500;padding:6px 16px;border-radius:20px;margin-bottom:28px}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:#7c6fff;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
h1.title{font-size:clamp(38px,7vw,72px);font-weight:800;line-height:1.04;letter-spacing:-2.5px;margin-bottom:20px}
.grad{background:linear-gradient(135deg,#7c6fff 0%,#ff6fd8 50%,#4fb3ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:17px;color:var(--text2);line-height:1.65;max-width:540px;margin:0 auto 40px;font-weight:300}

/* ── API SETUP BANNER ── */
.api-banner{max-width:700px;margin:0 auto 28px;background:#ff4f6d0c;border:1px solid #ff4f6d28;border-radius:18px;padding:18px 22px;display:flex;align-items:flex-start;gap:14px}
.api-banner-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.api-banner h4{font-size:14px;font-weight:700;color:#ff8fa0;margin-bottom:5px;font-family:'Syne',sans-serif}
.api-banner p{font-size:12.5px;color:var(--text2);line-height:1.6}
.api-row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.api-input{flex:1;min-width:180px;background:#ffffff09;border:1px solid var(--border2);color:var(--text);font-size:13px;padding:9px 13px;border-radius:9px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.api-input:focus{border-color:#7c6fff60}
.api-input::placeholder{color:var(--text3)}
.save-btn{background:linear-gradient(135deg,#7c6fff,#b06fff);border:none;color:#fff;font-size:12px;font-weight:700;padding:9px 18px;border-radius:9px;cursor:pointer;font-family:'Syne',sans-serif;white-space:nowrap;transition:opacity .2s}
.save-btn:hover{opacity:.88}

/* ── MODEL SELECTOR ── */
.model-selector{max-width:700px;margin:0 auto 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.model-label{font-size:12px;color:var(--text3);white-space:nowrap}
.model-select{flex:1;background:#ffffff07;border:1px solid var(--border2);color:var(--text);font-size:13px;padding:9px 13px;border-radius:9px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;transition:border-color .2s;min-width:200px}
.model-select:focus{border-color:#7c6fff60}
.model-select option{background:#12121e;color:var(--text)}
.model-badge{font-size:10px;background:#4fffb018;border:1px solid #4fffb030;color:#4fffb0;padding:3px 9px;border-radius:5px;white-space:nowrap}
.model-badge.free{background:#4fffb018;border-color:#4fffb030;color:#4fffb0}
.model-badge.paid{background:#ffd16618;border-color:#ffd16630;color:#ffd166}

/* ── UPLOAD ── */
.upload-zone{max-width:700px;margin:0 auto 18px;border:2px dashed var(--border2);border-radius:26px;padding:52px 36px;text-align:center;cursor:pointer;transition:all .28s;background:#ffffff02;position:relative;overflow:hidden}
.upload-zone:hover,.upload-zone:focus-within{border-color:#7c6fff55;background:#7c6fff06}
.upload-zone.drag{border-color:#7c6fff;background:#7c6fff0f;transform:scale(1.012)}
.upload-zone.has-img{padding:0;border-style:solid;border-color:var(--border2);cursor:default}
.upload-icon{width:62px;height:62px;margin:0 auto 18px;background:linear-gradient(135deg,#7c6fff18,#ff6fd818);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px}
.upload-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;margin-bottom:9px}
.upload-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
.upload-cta{background:linear-gradient(135deg,#7c6fff,#b06fff);border:none;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:11px 28px;border-radius:11px;cursor:pointer;transition:all .22s}
.upload-cta:hover{opacity:.9;transform:translateY(-1px)}
.formats{font-size:11px;color:var(--text3);margin-top:14px}
.preview-img{width:100%;border-radius:24px;display:block;max-height:440px;object-fit:contain;background:#ffffff04}
.preview-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,#00000090);border-radius:24px;display:flex;align-items:flex-end;justify-content:space-between;padding:18px;opacity:0;transition:opacity .25s}
.upload-zone.has-img:hover .preview-overlay{opacity:1}
.preview-name{font-size:12px;color:#fff;background:#00000070;padding:5px 11px;border-radius:7px;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=file]{display:none}

/* ── ACTION BUTTONS ── */
.actions{max-width:700px;margin:0 auto 50px;display:flex;gap:12px;flex-wrap:wrap}
.btn-analyze{flex:1;background:linear-gradient(135deg,#7c6fff,#b06fff);border:none;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;padding:15px 30px;border-radius:14px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:9px;min-width:190px}
.btn-analyze:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 10px 36px #7c6fff30}
.btn-analyze:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}
.btn-roast{flex:1;background:linear-gradient(135deg,#ff4f6d18,#ff6fd818);border:1px solid #ff4f6d35;color:#ff9fb0;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;padding:15px 30px;border-radius:14px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:9px;min-width:170px}
.btn-roast:hover{background:linear-gradient(135deg,#ff4f6d28,#ff6fd828);border-color:#ff4f6d55;transform:translateY(-2px)}
.btn-roast:disabled{opacity:.28;cursor:not-allowed;transform:none}

/* ── ERROR ── */
.error-box{max-width:700px;margin:0 auto 26px;background:#ff4f6d10;border:1px solid #ff4f6d35;border-radius:14px;padding:16px 20px;font-size:13.5px;color:#ff8fa0;line-height:1.6}
.error-box strong{color:#ff6070;display:block;margin-bottom:4px;font-family:'Syne',sans-serif}

/* ── LOADING ── */
.loading-wrap{max-width:700px;margin:0 auto 50px}
.loading{background:#ffffff04;border:1px solid var(--border);border-radius:26px;padding:52px 36px;text-align:center}
.spinner{width:52px;height:52px;border:3px solid var(--border2);border-top-color:#7c6fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px}
.loading p{font-size:14px;color:var(--text2);margin-bottom:28px}
.loading-steps{display:flex;flex-direction:column;gap:9px;text-align:left;max-width:320px;margin:0 auto}
.step{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:10px;transition:all .4s;padding:2px 0}
.step.active{color:var(--text2)}
.step.done{color:var(--green)}
.step-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ── RESULTS ── */
.results{max-width:1140px;margin:0 auto;padding-bottom:90px}
.results-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.results-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.results-sub{font-size:13px;color:var(--text2);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.results-sub .chip{background:#ffffff08;border:1px solid var(--border);padding:3px 9px;border-radius:5px;font-size:11px}
.header-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start}
.btn-sm{background:#ffffff07;border:1px solid var(--border2);color:var(--text2);font-size:12px;font-weight:500;padding:9px 15px;border-radius:9px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-sm:hover{background:#ffffff12;color:var(--text);border-color:var(--border3)}

/* ── SCORE HERO ── */
.score-hero{background:linear-gradient(135deg,#7c6fff10,#ff6fd80b);border:1px solid #7c6fff25;border-radius:26px;padding:32px 36px;margin-bottom:20px;display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.score-meter{position:relative;width:128px;height:128px;flex-shrink:0}
.score-meter svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.score-num .big{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;line-height:1}
.score-num .lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px}
.score-info{flex:1;min-width:220px}
.score-grade{font-size:12px;font-weight:600;padding:4px 12px;border-radius:7px;margin-bottom:12px;display:inline-block;letter-spacing:.3px}
.score-info h2{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
.score-info p{font-size:14px;color:var(--text2);line-height:1.65}

/* ── CATEGORIES GRID ── */
.categories-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:20px}
.cat-card{background:#ffffff04;border:1px solid var(--border);border-radius:20px;padding:20px 22px;transition:all .27s;position:relative;overflow:hidden;cursor:pointer;user-select:none}
.cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cc,#7c6fff);opacity:.45;transition:opacity .27s}
.cat-card:hover{border-color:var(--border2);background:#ffffff07;transform:translateY(-2px)}
.cat-card:hover::before,.cat-card.sel::before{opacity:1}
.cat-card.sel{border-color:#7c6fff40;background:#7c6fff07}
.cat-header{display:flex;align-items:center;margin-bottom:13px}
.cat-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--cb,#7c6fff18);flex-shrink:0}
.cat-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-left:11px;flex:1}
.cat-score{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.prog-bar{height:4px;background:#ffffff0d;border-radius:2px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;border-radius:2px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.issue-count{font-size:12px;color:var(--text3)}

/* ── ISSUES PANEL ── */
.issues-panel{background:#ffffff03;border:1px solid var(--border);border-radius:22px;padding:26px;margin-bottom:20px}
.issues-panel-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.issues-panel-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.cat-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:20px;padding-bottom:2px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.tab-btn{background:#ffffff07;border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;font-family:'DM Sans',sans-serif}
.tab-btn:hover{background:#ffffff10;color:var(--text)}
.tab-btn.active{background:#7c6fff18;border-color:#7c6fff45;color:#a99fff}
.no-issues{text-align:center;padding:36px;color:var(--text3);font-size:14px}
.issue-card{background:#ffffff04;border:1px solid var(--border);border-radius:13px;padding:15px 16px;margin-bottom:10px;transition:all .22s}
.issue-card:last-child{margin-bottom:0}
.issue-card:hover{border-color:var(--border2);background:#ffffff08}
.issue-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sev{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.6px;flex-shrink:0;margin-top:2px}
.sev-high{background:#ff4f6d18;color:#ff8fa0;border:1px solid #ff4f6d2c}
.sev-medium{background:#ffd16618;color:#ffe080;border:1px solid #ffd1662c}
.sev-low{background:#4fb3ff18;color:#80cbff;border:1px solid #4fb3ff2c}
.issue-problem{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.55}
.issue-solution{font-size:12.5px;color:var(--text2);line-height:1.6;padding:9px 12px;background:#ffffff04;border-radius:9px;border-left:2px solid #7c6fff45}
.issue-solution strong{color:var(--text);font-weight:500}

/* ── TOP IMPROVEMENTS ── */
.top-improvements{background:linear-gradient(135deg,#ffffff04,#ffffff02);border:1px solid var(--border);border-radius:22px;padding:26px;margin-bottom:20px}
.top-improvements h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:18px}
.imp-item{display:flex;align-items:flex-start;gap:13px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text2);line-height:1.6}
.imp-item:last-child{border-bottom:none;padding-bottom:0}
.imp-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#7c6fff,#b06fff);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Syne',sans-serif;margin-top:1px}

/* ── ROAST BANNER ── */
.roast-banner{background:linear-gradient(135deg,#ff4f6d15,#ff6fd815);border:1px solid #ff4f6d35;border-radius:18px;padding:18px 22px;margin-bottom:20px;font-size:14px;color:#ff9fb0;font-style:italic;line-height:1.65}
.roast-banner strong{color:#ff6f80;font-style:normal;font-family:'Syne',sans-serif}

/* ── HISTORY ── */
.history-section{max-width:1140px;margin:0 auto 52px}
.history-section h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px}
.history-grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.history-item{background:#ffffff04;border:1px solid var(--border);border-radius:14px;padding:13px;cursor:pointer;flex-shrink:0;width:180px;transition:all .22s}
.history-item:hover{border-color:var(--border2);background:#ffffff08;transform:translateY(-2px)}
.history-thumb{width:100%;height:92px;border-radius:9px;object-fit:cover;margin-bottom:9px;background:#ffffff07}
.history-score{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1}
.history-date{font-size:11px;color:var(--text3);margin-top:3px}

/* ── FEATURES (empty state) ── */
.features{max-width:960px;margin:70px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.feat-card{background:#ffffff03;border:1px solid var(--border);border-radius:22px;padding:26px;transition:all .3s}
.feat-card:hover{border-color:var(--border2);background:#ffffff07;transform:translateY(-3px)}
.feat-icon{font-size:26px;margin-bottom:13px}
.feat-card h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:7px}
.feat-card p{font-size:13px;color:var(--text2);line-height:1.65}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:#00000085;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal{background:#0f0f1e;border:1px solid var(--border2);border-radius:24px;padding:32px;max-width:500px;width:100%;position:relative}
.modal h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;background:#ffffff10;border:none;color:var(--text2);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:#ffffff18;color:var(--text)}
.modal label{font-size:12px;color:var(--text3);display:block;margin-bottom:5px;margin-top:14px}
.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(110px);background:#14142a;border:1px solid #7c6fff45;color:var(--text);font-size:13px;font-weight:500;padding:11px 22px;border-radius:12px;transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:1000;font-family:'DM Sans',sans-serif;pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px #0009}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .actions{flex-direction:column}
  .score-hero{flex-direction:column;text-align:center;align-items:center;padding:24px}
  .categories-grid{grid-template-columns:1fr}
  .results-header{flex-direction:column}
  h1.title{letter-spacing:-1.5px}
  .model-selector{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="wrap">
  <nav>
    <a href="#" class="logo" onclick="goHome();return false">
      <div class="logo-icon">✦</div>
      DesignCritiq
    </a>
    <div class="nav-right">
      <div class="nav-badge">OpenRouter AI</div>
      <button class="nav-btn" onclick="showKeyModal()">🔑 API Key</button>
    </div>
  </nav>
  <div id="app"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   OPENROUTER MODELS
═══════════════════════════════════════════ */
const MODELS = [

3. Be SPECIFIC — name exact elements, colors, pixel values, contrast ratios, spacing inconsistencies. Vague praise is not allowed.
4. Scoring is STRICT: Most real-world UIs score 30–55. Only agency-quality, production-tested interfaces reach 70+. "Good" is 65. Exceptional is 80+. Anything above 85 is nearly impossible. Default to being lower unless the design is genuinely flawless.
5. You must dig deep: look for misaligned elements, inconsistent padding, poor touch targets, color contrast failures, missing focus states, ambiguous CTAs, broken visual rhythm, unclear hierarchy, poor empty states, unreadable font sizes, icon ambiguity, and anything else a senior reviewer would flag.
6. DO NOT be encouraging or softening. Every "fix" suggestion must be concrete and technical.

Look for ALL of the following across every design:
TYPOGRAPHY: Inconsistent font weights, too many typefaces, poor line-height (<1.4 or >1.8), improper heading hierarchy (h1→h3 skipping), text too small (<12px), improper letter-spacing, unreadable font on colored backgrounds, missing fallback fonts.
SPACING & LAYOUT: Unequal padding (e.g. 14px left vs 16px right), missing 8pt grid alignment, cramped elements, excessive whitespace that loses structure, inconsistent margins between similar elements, broken responsive behavior.

Evaluate these 6 areas:

{"overall_score":number,"summary":"2-3 sentence brutally honest assessment that names specific flaws — do NOT say it looks clean or good without caveats","categories":{"typography":{"score":number,"issues":[{"severity":"low|medium|high","problem":"specific problem with exact details","solution":"concrete technical fix"},{"severity":"low|medium|high","problem":"another specific problem","solution":"concrete technical fix"}]},"spacing_layout":{"score":number,"issues":[{"severity":"low|medium|high","problem":"...","solution":"..."},{"severity":"low|medium|high","problem":"...","solution":"..."}]},"visual_hierarchy":{"score":number,"issues":[{"severity":"low|medium|high","problem":"...","solution":"..."},{"severity":"low|medium|high","problem":"...","solution":"..."}]},"accessibility":{"score":number,"issues":[{"severity":"low|medium|high","problem":"...","solution":"..."},{"severity":"low|medium|high","problem":"...","solution":"..."}]},"ui_consistency":{"score":number,"issues":[{"severity":"low|medium|high","problem":"...","solution":"..."},{"severity":"low|medium|high","problem":"...","solution":"..."}]},"ux_feedback":{"score":number,"issues":[{"severity":"low|medium|high","problem":"...","solution":"..."},{"severity":"low|medium|high","problem":"...","solution":"..."}]}},"top_improvements":["Specific improvement #1 with technical detail","Specific improvement #2 with technical detail","Specific improvement #3 with technical detail","Specific improvement #4 with technical detail","Specific improvement #5 with technical detail"]}

function scoreColor(s){
  if(s>=80) return '#4fffb0';
  if(s>=60) return '#ffd166';
  if(s>=40) return '#ff8c69';
  return '#ff4f6d';
}
function scoreGrade(s){
  if(s>=90) return {label:'Excellent ✦', color:'#4fffb0', bg:'#4fffb018'};
  if(s>=75) return {label:'Good',        color:'#a0f0c0', bg:'#4fffb010'};

  if(s>=40) return {label:'Needs Work',  color:'#ff8c69', bg:'#ff8c6918'};
  return           {label:'Critical',    color:'#ff4f6d', bg:'#ff4f6d18'};
}
function showToast(msg, dur=2800){

function handleFile(file){
  if(!file) return;
  if(!file.type.match(/^image\//)){showToast('⚠️ Please upload an image file'); return;}
  if(file.size > 20*1024*1024){showToast('⚠️ Image too large (max 20MB)'); return;}
  const url = URL.createObjectURL(file);
  const reader = new FileReader();
  reader.onload = ev => {
    const full = ev.target.result;
    const b64  = full.split(',')[1];
    const mime = file.type || 'image/jpeg';
    set({image:b64, imageURL:url, imageName:file.name, imageMime:mime, result:null, error:null});
  };
  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════
   ANALYSIS — OPENROUTER API
═══════════════════════════════════════════ */
async function analyze(roast){
  if(!S.image){  showToast('⚠️ Upload an image first'); return; }
  if(!S.apiKey){ showKeyModal(); return; }

  S.roastMode = !!roast;
  set({view:'loading', loadStep:0, result:null, error:null});

  const iv = setInterval(()=> set({loadStep: Math.min(S.loadStep+1, 3)}), 1500);

  try {
    const prompt  = roast ? BASE_PROMPT + ROAST_SUFFIX : BASE_PROMPT;
    const payload = {
      model: S.model,
      messages: [{
        role: 'user',
        content: [
          { type:'image_url', image_url:{ url:`data:${S.imageMime};base64,${S.image}` } },
          { type:'text', text: prompt }
        ]
      }],
      max_tokens: 4000,
      temperature: 0.7,
    };

    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${S.apiKey}`,
        'HTTP-Referer':  window.location.href,
        'X-Title':       'DesignCritiq',
      },
      body: JSON.stringify(payload),
    });

    clearInterval(iv);

    if(!res.ok){
      let msg = `API Error ${res.status}`;
      try{ const j=await res.json(); msg = j.error?.message || j.error || msg; }catch{}
      throw new Error(msg);
    }

    const data = await res.json();
    let raw = data.choices?.[0]?.message?.content || '';

    // Strip markdown fences if present
    const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
    if(fence) raw = fence[1];
    raw = raw.trim();

    let parsed;
    try { parsed = JSON.parse(raw); }
    catch {
      const m = raw.match(/\{[\s\S]*\}/);
      if(m) parsed = JSON.parse(m[0]);
      else throw new Error('Could not parse AI response. Try a different model.');
    }

    if(!parsed.overall_score || !parsed.categories)
      throw new Error('Incomplete AI response. Please try again.');

    // Detect lazy/over-generous models: if ALL categories have 0-1 issues, show warning
    const cats = Object.values(parsed.categories||{});
    const totalIssues = cats.reduce((n,c)=>n+(c.issues||[]).length, 0);
    const lazyModel = totalIssues < cats.length * 2; // less than avg 2 per category
    if(lazyModel) parsed._lazyWarning = true;

    // Guard against inflated scores — cap overall to max of category averages + 5
    const catAvg = cats.length ? cats.reduce((n,c)=>n+(c.score||0),0)/cats.length : 100;
    if(parsed.overall_score > catAvg + 8) parsed.overall_score = Math.round(catAvg + 5);

    const modelObj = MODELS.find(m=>m.id===S.model);
    saveHistory({
      score: parsed.overall_score,
      thumb: S.imageURL,
      date:  new Date().toLocaleDateString(),
      model: modelObj?.label || S.model,
      data:  parsed,
    });

    set({view:'results', result:parsed, activeTab:'typography', loadStep:4});

  } catch(e){
    clearInterval(iv);
    set({view:'home', error: e.message});
  }
}

/* ═══════════════════════════════════════════
   SVG SCORE METER
═══════════════════════════════════════════ */
function MeterSVG(score, size=128){
  const r=size*.43, cx=size/2, cy=size/2;
  const c=2*Math.PI*r, pct=Math.min(Math.max(score||0,0),100)/100;
  const d=c*pct, g=c-d, col=scoreColor(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ffffff0d" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="9"
      stroke-dasharray="${d.toFixed(2)} ${g.toFixed(2)}" stroke-linecap="round"
      style="transition:stroke-dasharray 1.3s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

        const km=CAT[k], sc=kd.score||0;
        return `<div class="cat-card${S.activeTab===k?' sel':''}" style="--cc:${km.color};--cb:${km.bg}" onclick="set({activeTab:'${k}'})">
          <div class="cat-header">
            <div class="cat-icon">${km.icon}</div>
            <div class="cat-name">${km.label}</div>
            <div class="cat-score" style="color:${scoreColor(sc)}">${sc}</div>
          </div>
          <div class="prog-bar"><div class="prog-fill" style="width:${sc}%;background:${scoreColor(sc)}"></div></div>
          <div class="issue-count">${(kd.issues||[]).length} issue${(kd.issues||[]).length!==1?'s':''} found</div>
        </div>`;
      }).join('')}
    </div>

    <div class="issues-panel">
      <div class="issues-panel-title">
        <span style="background:${m.bg};color:${m.color};padding:5px 10px;border-radius:8px;font-size:14px">${m.icon}</span>
        ${m.label} Issues
      </div>
      <div class="issues-panel-sub">Score: <strong style="color:${scoreColor(cd.score||0)}">${cd.score||0}/100</strong> &nbsp;·&nbsp; ${(cd.issues||[]).length} issue${(cd.issues||[]).length!==1?'s':''}</div>
      <div class="cat-tabs">
        ${cats.map(k=>`<button class="tab-btn${S.activeTab===k?' active':''}" onclick="set({activeTab:'${k}'})">${CAT[k].label}</button>`).join('')}
      </div>
      ${!(cd.issues||[]).length
        ? `<div class="no-issues">🔍 Dig deeper — every design has issues. Try re-analyzing with a stricter model.</div>`
        : (cd.issues||[]).map(i=>`
        <div class="issue-card">
          <div class="issue-top">
            <span class="sev sev-${(i.severity||'low').toLowerCase()}">${i.severity||'low'}</span>
            <div class="issue-problem">${i.problem||'Issue detected'}</div>
          </div>
          <div class="issue-solution"><strong>💡 Fix:</strong> ${i.solution||'Review and improve this area.'}</div>
        </div>`).join('')
      }
    </div>

    ${r.top_improvements?.length ? `
    <div class="top-improvements">
      <h3>🎯 Top Priority Improvements</h3>
      ${r.top_improvements.map((imp,i)=>`
      <div class="imp-item">
        <div class="imp-num">${i+1}</div>
        <div>${imp}</div>
      </div>`).join('')}
    </div>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════
   RENDER HISTORY
═══════════════════════════════════════════ */
function renderHistory(){
  const h = loadHistory();
  if(!h.length) return '';
  return `<div class="history-section">
    <h3>📂 Recent Analyses</h3>
    <div class="history-grid">
      ${h.map((item,i)=>`
      <div class="history-item" onclick="loadHistoryItem(${i})" title="${item.model||''} · ${item.date}">
        <img src="${item.thumb||''}" class="history-thumb" onerror="this.style.display='none'" alt="thumb">
        <div class="history-score" style="color:${scoreColor(item.score)}">${item.score}<span style="font-size:12px;color:var(--text3)">/100</span></div>
        <div class="history-date">${item.model ? item.model.split('/').pop().split('-').slice(0,3).join(' ') : ''}</div>
        <div class="history-date" style="margin-top:2px">${item.date}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

window.loadHistoryItem = function(i){
  const h = loadHistory();
  if(h[i]){ S.imageURL=h[i].thumb; S.imageName='History · '+h[i].date; set({result:h[i].data, view:'results', activeTab:'typography'}); }
};

/* ═══════════════════════════════════════════
   MAIN RENDER
═══════════════════════════════════════════ */
function render(){
  const app = document.getElementById('app');
  if(!app) return;

  /* ── RESULTS VIEW ── */
  if(S.view==='results' && S.result){ app.innerHTML=renderResults(S.result); return; }

  /* ── LOADING VIEW ── */
  if(S.view==='loading'){
    const STEPS=['Reading image data...','Connecting to OpenRouter...','AI analyzing your design...','Compiling feedback report...'];
    app.innerHTML=`
    <div class="hero">
      <div class="hero-badge"><span class="dot"></span> AI Analysis Running</div>
      <h1 class="title">Analyzing Your <span class="grad">UI...</span></h1>
      <p>Hang tight — the AI is reviewing every pixel.</p>
    </div>
    <div class="loading-wrap"><div class="loading">
      <div class="spinner"></div>
      <h3>Reviewing your design</h3>
      <p style="color:var(--text3);font-size:13px">Model: ${MODELS.find(m=>m.id===S.model)?.label||S.model}</p>
      <div class="loading-steps">
        ${STEPS.map((s,i)=>`
        <div class="step ${i<S.loadStep?'done':i===S.loadStep?'active':''}">
          <div class="step-dot"></div>${i<S.loadStep?'✓ ':''}${s}
        </div>`).join('')}
      </div>
    </div></div>`;
    return;
  }

  /* ── HOME VIEW ── */
  const hasKey = !!S.apiKey;
  const hist   = loadHistory();
  const curModel = MODELS.find(m=>m.id===S.model) || MODELS[0];

  app.innerHTML=`
  <div class="hero">
    <div class="hero-badge"><span class="dot"></span> AI-Powered Design Review</div>
    <h1 class="title">Your UI, <span class="grad">Brutally Honest.</span></h1>
    <p>Upload any UI screenshot and get a no-mercy audit — every flaw exposed, every inconsistency called out, every accessibility failure flagged. No participation trophies.</p>
  </div>

  ${!hasKey ? `
  <div class="api-banner">
    <div class="api-banner-icon">🔑</div>
    <div style="flex:1">
      <h4>Add Your OpenRouter API Key</h4>
      <p>Get a free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>. Many vision models have free tiers. Your key is stored only in your browser.</p>
      <div class="api-row">
        <input class="api-input" type="password" id="inlineKey" placeholder="sk-or-v1-...">
        <button class="save-btn" onclick="saveInlineKey()">Save Key</button>
      </div>
    </div>
  </div>` : ''}

  <div class="model-selector">
    <span class="model-label">🤖 Model:</span>
    <select class="model-select" id="modelSel" onchange="changeModel(this.value)">
      ${MODELS.map(m=>`<option value="${m.id}" ${m.id===S.model?'selected':''}>${m.label}</option>`).join('')}
    </select>
    <span class="model-badge ${curModel.tier}">${curModel.tier==='free'?'Free Tier':'Paid'}</span>
  </div>

  <div class="upload-zone${S.imageURL?' has-img':''}" id="dropzone"
    ondragover="event.preventDefault();this.classList.add('drag')"
    ondragleave="this.classList.remove('drag')"
    ondrop="this.classList.remove('drag');handleFile(event.dataTransfer.files[0]);event.preventDefault()"
    ${S.imageURL?'':'onclick="document.getElementById(\'fi\').click()"'}>
    ${S.imageURL ? `
      <img src="${S.imageURL}" class="preview-img" alt="Preview">
      <div class="preview-overlay">
        <span class="preview-name">📷 ${S.imageName||'image'}</span>
        <button class="upload-cta" onclick="event.stopPropagation();document.getElementById('fi').click()" style="padding:8px 18px;font-size:12px">Change</button>
      </div>` : `
      <div class="upload-icon">📤</div>
      <div class="upload-title">Drop your UI screenshot here</div>
      <div class="upload-sub">Drag & drop, click to browse, or paste with Ctrl+V</div>
      <button class="upload-cta" onclick="event.stopPropagation();document.getElementById('fi').click()">Choose Image</button>
      <div class="formats">PNG · JPG · WebP · up to 20MB</div>`}
  </div>
  <input type="file" id="fi" accept="image/*" onchange="handleFile(this.files[0])">

  <div class="actions">
    <button class="btn-analyze" ${!S.image||!S.apiKey?'disabled':''} onclick="analyze(false)">✦ Analyze Design</button>
    <button class="btn-roast"   ${!S.image||!S.apiKey?'disabled':''} onclick="analyze(true)">🔥 Roast My UI</button>
  </div>

  ${S.error ? `<div class="error-box"><strong>⚠️ Error</strong>${S.error}<br><span style="font-size:12px;opacity:.7;margin-top:4px;display:block">Check your API key and selected model, then try again.</span></div>` : ''}

  ${hist.length ? renderHistory() : `
  <div class="features">
    <div class="feat-card"><div class="feat-icon">🤖</div><h3>Multiple AI Models</h3><p>Choose from free models like Gemini Flash & Llama Vision, or premium ones like Claude 3.5 Sonnet and GPT-4o.</p></div>
    <div class="feat-card"><div class="feat-icon">🎯</div><h3>6 Design Categories</h3><p>Deep analysis across typography, spacing, visual hierarchy, accessibility, UI consistency, and UX flow.</p></div>
    <div class="feat-card"><div class="feat-icon">♿</div><h3>Accessibility Audit</h3><p>WCAG compliance checks, contrast ratios, and inclusive design recommendations with actionable fixes.</p></div>
    <div class="feat-card"><div class="feat-icon">🔥</div><h3>Roast Mode</h3><p>Brutally honest, slightly savage feedback from an AI acting as a caffeinated senior designer at 2am.</p></div>
    <div class="feat-card"><div class="feat-icon">📥</div><h3>Export Reports</h3><p>Copy the full text report or download a formatted PDF to share with your design team.</p></div>
    <div class="feat-card"><div class="feat-icon">🕑</div><h3>Analysis History</h3><p>Last 10 analyses saved locally so you can track design improvements over time.</p></div>
  </div>`}`;
}

/* ═══════════════════════════════════════════
   GLOBAL HELPERS
═══════════════════════════════════════════ */
window.set         = set;
window.goHome      = goHome;
window.handleFile  = handleFile;
window.analyze     = analyze;
window.copyReport  = copyReport;
window.downloadPDF = downloadPDF;
window.showKeyModal= showKeyModal;
window.changeModel = function(v){ S.model=v; localStorage.setItem('dcritiq_model',v); render(); };
window.saveInlineKey = function(){
  const v=document.getElementById('inlineKey')?.value?.trim();
  if(v){ localStorage.setItem('dcritiq_or_key',v); S.apiKey=v; showToast('✅ API key saved!'); render(); }
  else showToast('⚠️ Please enter a valid key');
};

/* Clipboard paste */
document.addEventListener('paste', e=>{
  const item=Array.from(e.clipboardData?.items||[]).find(i=>i.type.startsWith('image/'));
  if(item){ handleFile(item.getAsFile()); showToast('📋 Image pasted from clipboard!'); }
});

/* Boot */
render();
</script>
</body>
</html>
